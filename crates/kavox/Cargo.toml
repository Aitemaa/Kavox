[package]
name = "kavox"
version = "0.1.2"
edition.workspace = true
rust-version = "1.95"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Free soundboard with a virtual microphone"

[dependencies]
kavox-core = { version = "0.0.0", path = "../kavox-core" }
kavox-ipc = { version = "0.0.0", path = "../kavox-ipc" }
auto-launch = "0.6"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
global-hotkey = "0.10"
open = "5"
png = "0.18"
rfd = "0.17"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
signal-hook = "0.4.5"
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
