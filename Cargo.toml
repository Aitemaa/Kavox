[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/Aitemaa/Kavox"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1

[profile.release.package.kavox-core]
opt-level = 3
