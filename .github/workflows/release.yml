name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to build the Windows installer and
# attach it to a draft GitHub release. "Run workflow" in the Actions tab builds it without a release,
# and keeps the installer as a downloadable artifact instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json. Bump the version, then tag again."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --no-fund --no-audit

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Attach the installer to a draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/nsis/*.exe
          draft: true
          generate_release_notes: true

      - name: Keep the installer as an artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: kavox-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
