name: Release

# Push a version tag (git tag v0.1.1 && git push origin v0.1.1) to build the Windows release zip and
# attach it to a draft GitHub release. "Run workflow" in the Actions tab builds it without a release,
# and keeps the archive as a downloadable artifact instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/kavox/Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in crates/kavox/Cargo.toml. Bump the version, then tag again."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Kavox and kavoxctl
        run: cargo build --release -p kavox -p kavoxctl

      - name: Package Windows release zip
        shell: pwsh
        run: |
          $stage = "target/release/kavox-${{ steps.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/kavox.exe $stage/
          Copy-Item target/release/kavoxctl.exe $stage/
          Copy-Item LICENSE $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip" -Force

      - name: Attach the release archive to a draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/kavox-*-windows-x64.zip
          draft: true
          generate_release_notes: true

      - name: Keep the archive as an artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: kavox-windows-x64
          path: target/release/kavox-*-windows-x64.zip
          if-no-files-found: error
